<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odhlášení z newsletteru — KAI Tech</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#070d1f;--navy2:#0c1530;--blue:#1e6bff;--cyan:#00c2ff;--white:#fff;--gray:#8899bb;--gray2:#c4d0e8;--border:rgba(100,140,255,0.15)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);line-height:1.7}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem;background:rgba(7,13,31,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
@media(max-width:640px){nav{padding:1rem 1.25rem}}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:var(--white);text-decoration:none;display:flex;align-items:center;gap:.5rem}
.nav-logo span{color:var(--cyan)}
.nav-back{font-size:.85rem;color:var(--gray);text-decoration:none;transition:color .2s}
.nav-back:hover{color:var(--white)}
.container{max-width:780px;margin:0 auto;padding:7rem 2rem 5rem}
.doc-tag{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:.75rem}
h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem}
.doc-meta{font-size:.82rem;color:var(--gray);margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
h2{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;color:var(--white);margin:2.5rem 0 .75rem}
p{font-size:.95rem;color:var(--gray2);margin-bottom:.75rem}
ul{margin:.5rem 0 .75rem 1.25rem;color:var(--gray2);font-size:.95rem}
ul li{margin-bottom:.35rem}
strong{color:var(--white);font-weight:600}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;margin:1rem 0 1.5rem;font-size:.88rem}
th{background:rgba(30,107,255,.1);color:var(--white);font-weight:600;padding:.75rem 1rem;text-align:left;border:1px solid var(--border)}
td{padding:.65rem 1rem;color:var(--gray2);border:1px solid var(--border);vertical-align:top}
.highlight-box{background:rgba(30,107,255,.06);border:1px solid rgba(30,107,255,.2);border-radius:10px;padding:1.25rem 1.5rem;margin:1.5rem 0}
.highlight-box p{margin:0;color:var(--gray2);font-size:.9rem}
footer{background:var(--navy2);border-top:1px solid var(--border);padding:1.5rem 3rem;text-align:center;font-size:.78rem;color:var(--gray)}
footer a{color:inherit}

.note{border-radius:10px;padding:1rem 1.25rem;margin:0 0 2rem;font-size:.92rem}
.note.ok{background:rgba(0,194,255,.08);border:1px solid rgba(0,194,255,.3);color:var(--white)}
.note.err{background:rgba(255,120,80,.08);border:1px solid rgba(255,120,80,.3);color:var(--white)}
.note[hidden]{display:none}
.bod{display:grid;grid-template-columns:2.2rem 1fr;gap:.9rem;padding:1.25rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.bod input{width:1.2rem;height:1.2rem;margin-top:.35rem;accent-color:var(--blue);cursor:pointer}
.bod h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:.3rem}
.bod p{margin-bottom:.35rem}
.bod .law{font-size:.78rem;color:var(--gray)}
.bod input:checked + div h3{color:var(--gray);text-decoration:line-through}
.progress{font-size:.85rem;color:var(--gray);margin-top:1.25rem}
.cta{margin-top:3rem;background:rgba(30,107,255,.06);border:1px solid rgba(30,107,255,.2);border-radius:12px;padding:1.5rem}
.cta h2{margin-top:0}
.btn{display:inline-block;margin-top:.5rem;padding:.75rem 1.5rem;background:var(--blue);color:#fff;border-radius:7px;font-weight:500}
.btn:hover{text-decoration:none;background:#2a7dff}
@media(max-width:640px){.container{padding:6rem 1rem 4rem}h1{font-size:1.6rem}}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <svg width="28" height="32" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <defs><linearGradient id="kaiG2" x1="0" y1="40" x2="36" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1e6bff"/><stop offset="100%" stop-color="#7eb3ff"/></linearGradient></defs>
      <path d="M4 36 Q18 28 32 36" stroke="url(#kaiG2)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M18 4 L31 34 L5 34 Z" fill="url(#kaiG2)" opacity="0.9"/>
      <path d="M18 18 L23 30 L13 30 Z" fill="#070d1f"/>
      <circle cx="18" cy="3" r="2.2" fill="#00c2ff"/>
      <line x1="18" y1="0.5" x2="18" y2="5.5" stroke="#00c2ff" stroke-width="1" opacity="0.6"/>
    </svg>
    KAI<span>Tech</span>
  </a>
  <a href="/" class="nav-back">← Zpět na hlavní stránku</a>
</nav>

<div class="container">
  <div class="doc-tag">Newsletter</div>
  <h1 id="nadpis">Odhlášení proběhlo</h1>
  <p id="text">Z newsletteru KAI Tech jsme vás odhlásili a další e-maily vám už nepošleme. Pokud to byla chyba, přihlásit se můžete znovu na <a href="/#newsletter">hlavní stránce</a>.</p>
</div>
<script>
if (new URLSearchParams(location.search).get('stav') === 'neplatny') {
  document.getElementById('nadpis').textContent = 'Odkaz neplatí';
  document.getElementById('text').innerHTML = 'Tento odhlašovací odkaz jsme nenašli. Napište nám na <a href="mailto:info@kaitechinvest.com">info@kaitechinvest.com</a> a odhlásíme vás ručně.';
}
</script>

<footer>
  © 2026 KAI Tech · Ctibor Klíma · IČO: 02235471 ·
  <a href="/vop.html">Obchodní podmínky</a> ·
  <a href="/gdpr.html">Ochrana osobních údajů</a>
</footer>

</body>
</html>
